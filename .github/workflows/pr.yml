name: PR
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
concurrency:
  group: ${{ github.ref }}-pr
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    name: Checks
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    uses: hoprnet/hopr-workflows/.github/workflows/checks.yaml@9d3880d21d35d3ee6d3bc5cde6b62e91a84b56d8 # workflow-checks-v2.1.0
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      pre_commit: false
      lint: false
      deps: false
      audit: false
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  ci-ok:
    name: CI OK
    # Single required status check: stable across matrix expansion, label gating and fork guards.
    if: always() # a skipped job counts as passing, so never let a failed dependency skip this one
    needs: [checks]
    runs-on: depot-ubuntu-22.04-4
    permissions: {}
    steps:
      - name: Fail if any CI job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
