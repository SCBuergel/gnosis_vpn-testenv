# The traffic target as a tiny project, for its tests: no runtime dependencies (stdlib only), pytest as the dev
# group, unpackaged (no build system: the image copies the modules, nothing is installed).
#   uv run --directory docker/target pytest        # or: just target-test
[project]
name = "gnosis-vpn-target"
version = "0.1.0"
description = "In-cluster traffic target for the gnosis_vpn regression suite: sized HTTP download/upload, UDP echo, paced stream server, two-way call server"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
