# The traffic target as a tiny project: no runtime dependencies (stdlib only), pytest for its own tests.
#   uv run --directory docker/target pytest        # or: just target-test
[project]
name = "gnosis-vpn-target"
version = "0.1.0"
description = "In-cluster traffic target for the gnosis_vpn regression suite: sized HTTP download/upload, UDP echo, paced stream server, two-way call server"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gnosis-vpn-target = "main:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
