# Relay machine classes: T36-relay-machine-class's thresholds per infrastructure provider, machine size and rung.
# Generated by `python3 multihost/machine_ladder.py calibrate` from calibration runs; edit the ladders, providers and
# machine descriptions by hand, recalibrate the numbers. Format and rule: tests/suitelib/machineclass.py.
#
# measured_agg_mbit: aggregate download over the overlap, Mbit/s, one list per calibration run, entry n-1 = n clients
# measured_ping_p50_ms: median round trip through the tunnel during that download, ms
# agg_min_mbit, ping_p50_max_ms: the thresholds derived from them (derive(): floor_pct, ping_mult); a rung past the end
#   of these lists is uncalibrated and only recorded

[calibration]
source = "sw1, 2026-10-07: DigitalOcean lon1, one relay droplet per size, made for its test and deleted after it"
hoprd = "4.1.3"
client = "gnosis_vpn-ctl 0.96.4"
client_image = "gnosis_vpn-client:0.96.4-snap-20260929.073145"
server = "gnosis_vpn-server:0.7.0-upstream"
floor_pct = 75
ping_mult = 2
knobs = { DOWN_BYTES = 100000000, UP_BYTES = 0, CAP = 300, IDLE_S = 10, PING = 1 }
clients = { vcpus = 8 }
exits = { vcpus = 8 }

[providers.digitalocean]
detect = "curl -sf -m 3 http://169.254.169.254/metadata/v1/id"
region = "lon1"

[providers.digitalocean.ladders]
cpu-optimized = ["c-2", "c-4", "c-8", "c-16"]
basic = ["s-1vcpu-2gb", "s-2vcpu-4gb", "s-4vcpu-8gb", "s-8vcpu-16gb"]

[providers.digitalocean.sizes."c-2"]
vcpus = 2
memory_gb = 4
cpu_model = "Xeon"
runs = ["sw1-c2"]
measured_agg_mbit = [[4.13, 4.11, 4.09, 4.06, 3.92, 4.69]]
measured_ping_p50_ms = [[2569.0, 4574.0, 5962.0, 8103.0, 9862.0, 10698.0]]
agg_min_mbit = [3.0, 3.0, 3.0, 3.0, 2.5, 3.5]
ping_p50_max_ms = [5200, 9200, 12000, 16300, 19800, 21400]

